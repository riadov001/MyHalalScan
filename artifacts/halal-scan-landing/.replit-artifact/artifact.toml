kind = "web"
previewPath = "/halal-scan-landing/"
title = "HalalScan — Landing Page"
version = "1.0.0"
id = "artifacts/halal-scan-landing"
router = "path"

[[services]]
name = "web"
paths = [ "/halal-scan-landing/" ]
localPort = 19302

[services.development]
run = "pnpm --filter @workspace/halal-scan-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/halal-scan-landing", "run", "build" ]
serve = "static"
publicDir = "artifacts/halal-scan-landing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19302"
BASE_PATH = "/halal-scan-landing/"
